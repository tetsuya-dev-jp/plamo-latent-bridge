[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plamo-latent-bridge"
version = "0.1.0"
description = "Small exploratory latent-bridge experiment from PLaMo 3 Translate to a frozen Qwen causal LM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "transformers==4.57.1",
    "sentencepiece",
    "numba",
    "numpy",
    "matplotlib",
    "scipy",
    "psutil",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
